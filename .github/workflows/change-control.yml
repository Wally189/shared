name: change-control

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required control files
        run: |
          test -f CHANGE-CONTROL.md
          test -f .github/pull_request_template.md

      - name: Verify PR body contains traceability and evidence headings
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python - <<'PY'
          import os, sys
          body = os.environ.get('PR_BODY') or ''
          required = [
              '## Linked need',
              '## Intended outcome',
              '## Tests and evidence',
              '## Rollback',
              '## Information / security implications',
              '## Assurance / approval status',
          ]
          missing = [item for item in required if item not in body]
          if 'Closes #' not in body:
              missing.append('Closes #<issue>')
          if missing:
              print('Missing required PR control metadata:')
              for item in missing:
                  print(f'- {item}')
              sys.exit(1)
          print('Change-control metadata present.')
          PY
