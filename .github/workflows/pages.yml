name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate deployed release metadata
        shell: bash
        run: |
          cat > reference-version.txt <<EOF
          Modern Democratic Services
          Reference version: 2026-09-23
          Publication date: 23 September 2026
          Deployed source commit: ${GITHUB_SHA}
          Repository: Wally189/shared

          The commit SHA supports release traceability. It does not by itself
          establish organisational approval or trust.
          EOF

          cat > release.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Deployed release — Modern Democratic Services</title>
          <meta name="description" content="Deployed reference version and source commit">
          <link rel="stylesheet" href="style.css">
          </head>
          <body>
          <a class="skip-link" href="#main">Skip to main content</a>
          <header class="site-header"><div class="wrap"><p class="site-name"><a href="index.html">Modern Democratic Services</a></p><p class="site-subtitle">A public reference architecture for reliable democratic decision-making.</p></div></header>
          <main id="main" class="wrap">
          <p class="kicker">Release traceability</p>
          <h1>Deployed release</h1>
          <p><strong>Reference version:</strong> 2026-09-23</p>
          <p><strong>Publication date:</strong> 23 September 2026</p>
          <p><strong>Deployed source commit:</strong> <code>${GITHUB_SHA}</code></p>
          <div class="note"><p>A Git commit SHA identifies the deployed source. It does not itself establish organisational approval or prove that the content is trustworthy.</p></div>
          <p><a href="security.html">Security &amp; Trust Model</a> · <a href="index.html">Start</a></p>
          </main>
          <footer class="site-footer"><div class="wrap"><p><strong>Independent and unofficial.</strong> Public reference material only.</p></div></footer>
          </body></html>
          EOF

      - name: Verify release metadata
        shell: bash
        run: |
          test -s release.html
          test -s reference-version.txt
          grep -F "Deployed source commit: <code>${GITHUB_SHA}</code>" release.html
          grep -F "Deployed source commit: ${GITHUB_SHA}" reference-version.txt
          grep -F "Reference version: 2026-09-23" reference-version.txt

      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
